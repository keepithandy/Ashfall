name: Station 04 Environment Regression

on:
  pull_request:
    paths:
      - 'scenes/ashfall_station_main.tscn'
      - 'scripts/runtime/station04_*.gd'
      - 'assets/shaders/station04_ground.gdshader'
      - 'tests/check_station_grounding.gd'
      - 'tests/check_station_field_hud.gd'
      - 'tests/check_station_immersion.gd'
      - 'scripts/runtime/expedition_field_record.gd'
      - 'scripts/runtime/station04_world_detail.gd'
      - 'scripts/runtime/station04_visual_budget.gd'
      - 'scripts/runtime/village_stalker.gd'
      - 'scripts/runtime/hud.gd'
      - 'scripts/runtime/inventory_screen.gd'
      - 'scripts/runtime/ashfall_station_main.gd'
      - 'scripts/runtime/expedition_areas.gd'
      - 'tests/check_station_lighting.gd'
      - 'tests/check_station_wet_ground.gd'
      - 'assets/shaders/station04_wet_ground.gdshader'
      - '.github/workflows/station04-environment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-station04:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse Station 04 tree and grounding scripts before importing assets
        shell: bash
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/station04_treeline.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/station04_horizon.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/station04_near_canopies.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://tests/check_station_grounding.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://tests/check_station_field_hud.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/station04_world_detail.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/station04_visual_budget.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/expedition_field_record.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://tests/check_station_immersion.gd
      - name: Import project assets
        shell: bash
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import
      - name: Parse HUD and station gameplay scripts after class registration
        shell: bash
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/hud.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/inventory_screen.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/ashfall_station_main.gd
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/runtime/expedition_areas.gd
      - name: Verify Station 04 terrain, procedural relief and dressing
        shell: bash
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/check_station_grounding.gd
      - name: Verify Station 04 exterior lighting and fog setup
        shell: bash
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/check_station_lighting.gd
      - name: Verify collision-free wet-ground dressing
        shell: bash
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/check_station_wet_ground.gd
      - name: Verify live Station 04 HUD, view range, theme and world-caption cleanup
        shell: bash
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/check_station_field_hud.gd
      - name: Verify Ashfall 2.1 immersion, discovery and view-budget regression
        shell: bash
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/check_station_immersion.gd
      - name: Verify main scene parses and runs without startup failures
        shell: bash
        run: |
          timeout 35s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 30
