; Ashfall Crossroads placement configuration (Godot ConfigFile format).
; Recommended: place Node3D named CrossroadsStationAnchor in your world scene.
; The anchor wins over this file. Its Transform3D controls exact station position.
; Without an anchor, auto placement searches level ground ahead of the player.

[placement]
mode="near_player"
height_adjust=0.0

; For manual, predictable coordinates set mode="fixed" and edit these values:
fixed_position=Vector3(25, 0, 25)
yaw_degrees=0.0
